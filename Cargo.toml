[workspace]
members = [
    "crates/tsan-core",
    "crates/tsan-input",
    "crates/tsan-analyzer",
    "crates/tsan-tsduck-sys",
    "crates/tsan-runtime",
    "crates/tsan-player",
    "crates/tsan-cli",
    "crates/tsan-gui",
    "crates/tsan-platform",
    "crates/tsan-diagnostics",
    "crates/tsan-launcher",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tsan-core = { path = "crates/tsan-core" }
tsan-input = { path = "crates/tsan-input" }
tsan-analyzer = { path = "crates/tsan-analyzer", default-features = false }
tsan-tsduck-sys = { path = "crates/tsan-tsduck-sys" }
tsan-runtime = { path = "crates/tsan-runtime" }
tsan-player = { path = "crates/tsan-player" }
tsan-platform = { path = "crates/tsan-platform" }
tsan-diagnostics = { path = "crates/tsan-diagnostics" }
windows-core = "0.62.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
winit = { git = "https://github.com/LunaticGhoulPiano/winit.git", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }

# Keep interactive multi-file analysis fast in development builds too.
[profile.dev.package.tsan-core]
opt-level = 2

[profile.dev.package.tsan-analyzer]
opt-level = 2

[profile.dev.package.tsan-tsduck-sys]
opt-level = 2

# Keep matching PDBs outside user packages for crash symbolication.
[profile.release]
debug = 1
strip = "none"
