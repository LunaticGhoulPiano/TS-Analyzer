[package]
name = "tsan-analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
native-tsduck = ["dep:tsan-tsduck-sys", "tsan-tsduck-sys/native"]

[dependencies]
tsan-core = { workspace = true }
tsan-tsduck-sys = { workspace = true, optional = true }

[[example]]
name = "gop_probe"
path = "../../developmentHelpers/examples/analyzer/gop_probe.rs"

[[example]]
name = "report"
path = "../../developmentHelpers/examples/analyzer/report.rs"
